<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tío Pollo — App de Recetario</title>
<style>
  :root{
    --rojo:#8B2E2E; --rojo-osc:#6e2323; --dorado:#D9A441; --crema:#FBF6EE;
    --tinta:#2B2320; --linea:#E7DCCB; --muted:#8a7d6f; --verde:#4C7A50; --rojo-err:#B23A3A;
    --superficie:#fff; --sombra-tarjeta:rgba(43,35,32,.10);
  }
  [data-theme="dark"]{
    --crema:#1A1512; --tinta:#F3EBDF; --linea:rgba(255,255,255,.12); --muted:#a89a8a;
    --superficie:#241D19; --sombra-tarjeta:rgba(0,0,0,.35);
    --dorado:#E4B45C; --rojo:#A63D3D; --rojo-osc:#8a3131;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,'Segoe UI',Arial,sans-serif; background:var(--crema); color:var(--tinta); }
  .app{ display:flex; min-height:100vh; }

  /* Sidebar (desktop) / bottom nav (mobile) */
  .sidebar{ width:230px; background:var(--rojo); color:#fff; padding:18px 10px; flex-shrink:0; display:flex; flex-direction:column; }
  .sidebar-version{ margin-top:auto; padding:14px 6px 6px; font-size:10.5px; color:rgba(255,255,255,.55); border-top:1px solid rgba(255,255,255,.15); }
  .theme-toggle{ display:flex; align-items:center; gap:8px; padding:9px 14px; margin:2px 4px 6px; border-radius:10px; cursor:pointer; color:rgba(255,255,255,.8); font-size:12.5px; background:rgba(255,255,255,.06); border:none; }
  .theme-toggle:hover{ background:rgba(255,255,255,.12); color:#fff; }
  .theme-toggle-mobile{ position:fixed; top:14px; right:14px; z-index:70; width:38px; height:38px; border-radius:50%; background:var(--superficie); border:1px solid var(--linea); color:var(--tinta); display:none; align-items:center; justify-content:center; box-shadow:0 2px 6px var(--sombra-tarjeta); }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px 16px; border-bottom:1px solid rgba(255,255,255,.2); margin-bottom:12px; }
  .brand-mark{ width:36px; height:36px; object-fit:contain; flex-shrink:0; }
  .brand h1{ font-size:15px; margin:0; line-height:1.2; }
  .brand span{ font-size:10.5px; opacity:.8; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; font-size:14px; border-radius:10px; margin-bottom:4px; color:rgba(255,255,255,.75); transition:background .15s ease, color .15s ease, box-shadow .15s ease; }
  .nav-item:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .nav-item.active{ background:#fff; color:var(--rojo-osc); font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  .nav-item .nav-dot{ width:6px; height:6px; border-radius:50%; background:transparent; flex-shrink:0; }
  .nav-item.active .nav-dot{ background:var(--dorado); }
  .nav-icon{ width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; opacity:.9; flex-shrink:0; }
  .nav-icon svg{ display:block; }
  .nav-item.active .nav-icon{ opacity:1; }

  .main{ flex:1; padding:26px 30px 60px; max-width:900px; margin:0 auto; width:100%; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:10px; flex-wrap:wrap; }
  .topbar h2{ margin:0 0 2px; font-size:21px; }
  .eyebrow{ color:var(--rojo); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .btn{ background:var(--rojo); color:#fff; border:none; padding:10px 17px; border-radius:10px; font-size:13.5px; cursor:pointer; font-weight:600; box-shadow:0 2px 0 rgba(0,0,0,.12), 0 1px 3px rgba(43,35,32,.15); transition:background .15s ease, transform .08s ease, box-shadow .08s ease; }
  .btn:hover{ background:var(--rojo-osc); }
  .btn:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.12), 0 1px 2px rgba(43,35,32,.12); }
  .btn.secondary{ background:var(--superficie); color:var(--rojo); border:1px solid var(--rojo); box-shadow:0 1px 0 rgba(0,0,0,.05), 0 1px 2px rgba(43,35,32,.08); }
  .btn.secondary:hover{ background:#FBF0F0; }
  .btn.ghost{ background:transparent; color:var(--muted); border:1px solid var(--linea); box-shadow:none; }
  .btn.ghost:hover{ background:rgba(43,35,32,.04); }
  .btn.danger{ background:var(--superficie); color:var(--rojo-err); border:1px solid var(--rojo-err); box-shadow:0 1px 0 rgba(0,0,0,.05), 0 1px 2px rgba(43,35,32,.08); }
  .btn.danger:hover{ background:#FCEEEE; }
  .btn.small{ padding:6px 12px; font-size:12px; border-radius:8px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

  .card{ background:var(--superficie); border:1px solid var(--linea); border-radius:12px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px var(--sombra-tarjeta); }
  .card h3{ margin:0 0 12px; font-size:14px; color:var(--rojo-osc); text-transform:uppercase; letter-spacing:.03em; }

  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--linea); font-size:14px; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; }

  input, select, textarea{ font-family:inherit; font-size:13.5px; padding:7px 9px; border:1px solid var(--linea); border-radius:6px; background:var(--superficie); color:var(--tinta); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--dorado); outline-offset:0; border-color:var(--dorado); }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
  .form-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .form-row .field{ flex:1; min-width:120px; }

  .ing-row{ display:grid; grid-template-columns:1.4fr .9fr .8fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--linea); }
  .ing-row:last-child{ border-bottom:none; }
  .line-row{ display:grid; grid-template-columns:.9fr 1.3fr .7fr .5fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--linea); }
  .step-row{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; }
  .step-row textarea{ flex:1; min-height:44px; resize:vertical; }
  .step-num{ width:22px; height:22px; border-radius:50%; background:var(--dorado); color:#4a3300; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:6px; }

  .subrecipe-tag{ display:inline-block; background:#F3E7CE; color:#7a5b12; font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .type-tag{ display:inline-block; font-size:10px; font-weight:700; padding:1px 8px; border-radius:20px; margin-left:6px; }
  .type-tag.sub{ background:#F3E7CE; color:#7a5b12; }
  .type-tag.final{ background:#E4EFE3; color:var(--verde); }

  .muted{ color:var(--muted); font-size:12.5px; }
  .empty{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty .btn{ margin-top:10px; }

  .recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .recipe-card{ background:var(--superficie); border:1px solid var(--linea); border-radius:10px; padding:14px 16px; cursor:pointer; transition:border-color .15s; }
  .recipe-card:hover{ border-color:var(--dorado); }
  .recipe-card .code{ font-size:11px; color:var(--rojo); font-weight:700; }
  .recipe-card .name{ font-size:14.5px; font-weight:600; margin:3px 0 5px; }
  .recipe-card .meta{ font-size:12px; color:var(--muted); }

  .search-box{ width:100%; padding:9px 12px; margin-bottom:14px; }

  .kpi-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
  .kpi{ background:var(--crema); border:1px solid var(--linea); border-radius:10px; padding:10px 14px; min-width:110px; }
  .kpi .v{ font-size:17px; font-weight:700; color:var(--rojo-osc); }
  .kpi .l{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }

  .scale-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .scale-chip{ padding:5px 11px; border:1px solid var(--linea); border-radius:20px; font-size:12.5px; cursor:pointer; background:var(--superficie); color:var(--tinta); }
  .scale-chip.active{ background:var(--rojo); color:#fff; border-color:var(--rojo); }

  .steps-list{ padding-left:20px; margin:0; }
  .steps-list li{ margin-bottom:7px; line-height:1.45; }

  .book-cover{ text-align:center; padding:70px 20px 40px; }
  .book-cover img{ width:150px; height:auto; margin-bottom:18px; }
  .book-cover h1{ color:var(--rojo); font-size:28px; margin:0 0 6px; }
  .book-cover p{ color:var(--muted); font-size:13px; }
  .book-index-table td, .book-index-table th{ font-size:13.5px; }
  .book-recipe{ margin-bottom:10px; }
  .book-banner{ background:var(--superficie); border-left:4px solid var(--dorado); border-radius:6px; padding:14px 18px; margin-bottom:14px; }
  .book-banner .eyebrow2{ color:var(--rojo); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .book-banner h3{ margin:4px 0 0; font-size:21px; color:var(--tinta); font-weight:600; }
  @media print{
    .book-page-break{ break-before:page; page-break-before:always; }
  }
  @media screen{
    .book-page-break{ border-top:2px dashed var(--linea); margin-top:26px; padding-top:26px; }
  }

  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--tinta); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; display:flex; align-items:center; gap:6px; }
  .toast.success{ background:var(--verde); }
  .toast.error{ background:var(--rojo-err); }
  .toast .toast-icon{ display:inline-flex; flex-shrink:0; }

  /* Transicion suave entre vistas */
  #main.view-fade{ animation:viewFadeIn .22s ease; }
  @keyframes viewFadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  /* Skeleton loader */
  .skel-wrap{ padding:6px 2px; }
  .skel-line, .skel-card{ background:linear-gradient(90deg, var(--linea) 25%, rgba(255,255,255,.5) 37%, var(--linea) 63%); background-size:400% 100%; animation:skelShimmer 1.3s ease infinite; border-radius:8px; }
  .skel-line{ height:22px; width:180px; margin-bottom:20px; }
  .skel-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .skel-card{ height:84px; }
  @keyframes skelShimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
  .toast.show{ opacity:1; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(43,35,32,.45); display:flex; align-items:center; justify-content:center; z-index:80; padding:20px; }
  .modal-overlay.hidden{ display:none; }
  .modal-box{ background:var(--superficie); border-radius:14px; padding:22px 24px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto; box-shadow:0 10px 40px rgba(43,35,32,.25); }
  .modal-box h3{ margin:0 0 16px; font-size:16px; color:var(--rojo-osc); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .modal-box .field{ margin-bottom:12px; }
  .modal-box .field input, .modal-box .field select{ width:100%; }

  @media print{
    .sidebar, .no-print, .search-box{ display:none !important; }
    .main{ padding:0; max-width:none; margin:0; }
    .app{ display:block; }
    .card{ border:none; padding:0; }
    body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
    .report-table th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  }
  .print-only{ display:none; }
  @media print{
    .print-only{ display:block !important; }
  }
  .report-header{ display:flex; align-items:center; gap:14px; border-bottom:2px solid var(--rojo); padding-bottom:14px; margin-bottom:18px; }
  .report-header img{ width:46px; height:auto; }
  .report-header h1{ font-size:20px; color:var(--rojo); margin:0; }
  .report-header p{ font-size:11.5px; color:var(--muted); margin:2px 0 0; }
  .report-table{ width:100%; border-collapse:collapse; }
  .report-table th{ background:var(--rojo); color:#fff; font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:7px 8px; text-align:left; }
  .report-table th.num, .report-table td.num{ text-align:right; }
  .report-table td{ padding:6px 8px; border-bottom:1px solid var(--linea); font-size:12.5px; }
  .report-table tr:nth-child(even) td{ background:var(--crema); }
  .report-footer{ margin-top:16px; font-size:10.5px; color:var(--muted); text-align:right; }
  @media (max-width:760px){
    .app{ flex-direction:column; }
    .sidebar{
      width:100%; position:fixed; left:0; bottom:0; z-index:60;
      display:flex; flex-direction:row; align-items:stretch; justify-content:space-around;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 8px;
      overflow-x:auto; box-shadow:0 -2px 10px rgba(43,35,32,.14);
      border-top:1px solid rgba(255,255,255,.12);
    }
    .sidebar-version{ display:none; }
    .brand{ display:none; }
    .theme-toggle{ display:none; }
    .theme-toggle-mobile{ display:flex; }
    .nav-item{
      flex-direction:column; justify-content:center; gap:4px;
      white-space:nowrap; margin-bottom:0;
      padding:8px 10px; border-radius:12px; font-size:11px; flex:1;
      min-width:0; text-align:center; font-weight:500; color:rgba(255,255,255,.7);
      transition:background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .nav-item:hover{ background:rgba(255,255,255,.08); color:#fff; }
    .nav-item.active{ background:#fff; color:var(--rojo-osc); box-shadow:0 3px 8px rgba(0,0,0,.18); }
    .nav-item .nav-dot{ display:none; }
    .nav-icon{ width:20px; height:20px; font-size:19px; opacity:1; }
    .main{ padding:64px 16px 30px; padding-bottom:calc(78px + env(safe-area-inset-bottom)); }
    .line-row{ grid-template-columns:1fr; }
    .ing-row{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

// ============== STORAGE ==============
async function ensureAuth(){
  if(auth.currentUser) return;
  await new Promise((resolve, reject)=>{
    const unsub = auth.onAuthStateChanged(user=>{
      unsub();
      if(user){ resolve(); }
      else{
        auth.signInAnonymously().then(resolve).catch(reject);
      }
    });
  });
}
async function loadData(){
  try{
    await ensureAuth();
    const snap = await DATA_DOC.get();
    if(snap.exists && snap.data().payload){ DATA = JSON.parse(snap.data().payload); }
    else { DATA = seedData(); await saveData(false); }
  }catch(e){
    // documento no existe todavía o falló la conexión -> sembrar
    DATA = seedData();
    await saveData(false);
  }
  if(!DATA.suppliers) DATA.suppliers = []; // migración para datos guardados antes de Proveedores
  state.loaded = true;
  render();
  loadTheme();
}
async function saveData(showToast){
  try{
    await DATA_DOC.set({ payload: JSON.stringify(DATA), updatedAt: new Date().toISOString() });
    if(showToast) toast('Guardado', 'success');
  }catch(e){
    toast('No se pudo guardar (' + e.message + ')', 'error');
  }
}
function toast(msg, type){
  const t = document.getElementById('toast');
  const icon = type==='success' ? ICON.check : type==='error' ? ICON.alerta : '';
  t.innerHTML = (icon ? `<span class="toast-icon">${icon}</span>` : '') + msg;
  t.className = 'toast' + (type ? ' '+type : '') + ' show';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2000);
}

const THEME_KEY = 'tio_pollo_theme';
function applyTheme(){
  if(state.theme==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  else{ document.documentElement.removeAttribute('data-theme'); }
}
function loadTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(saved){ state.theme = saved; }
  }catch(e){}
  applyTheme();
  renderSidebar();
}
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  applyTheme();
  renderSidebar();
  try{ localStorage.setItem(THEME_KEY, state.theme); }catch(e){}
}

// ============== HELPERS ==============
function getIng(id){ return DATA.ingredients.find(i=>i.id===id); }
function getRecipe(code){ return DATA.recipes.find(r=>r.code===code); }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,8); }
function fmt(n){ return (n||0).toLocaleString('es-ES',{maximumFractionDigits:2}) + ' €'; }
function fmtPrice(n){ return (n||0).toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:4}) + ' €'; }
function fmtQty(qty, unit){
  if(unit==='g') return qty.toLocaleString('es-ES',{maximumFractionDigits:1}) + ' g';
  return qty.toLocaleString('es-ES',{maximumFractionDigits:2}) + ' ' + (unit==='litro'?'L':'ud');
}

// Los precios de ingredientes se cargan en €/kg (o €/L para líquidos, €/unidad para piezas —
// ver UNIT_TO_GRAMS). Esta función devuelve el precio ya convertido a la unidad nativa
// que usan las recetas (por gramo, por litro o por unidad), lista para multiplicar por la cantidad.
function pricePerBaseUnit(ing){
  return ing.price * (UNIT_TO_GRAMS[ing.unit]||1) / 1000;
}

function subCostPerGram(code, seen){
  seen = seen || new Set();
  if(seen.has(code)) return 0; // evita ciclos
  seen.add(code);
  const r = getRecipe(code);
  if(!r) return 0;
  let cost=0, grams=0;
  r.lines.forEach(l=>{
    if(l.kind==='ing'){
      const ing = getIng(l.ref); if(!ing) return;
      cost += l.qty * pricePerBaseUnit(ing);
      grams += l.qty * (UNIT_TO_GRAMS[ing.unit]||1);
    } else {
      const cpg = subCostPerGram(l.ref, seen);
      cost += cpg * l.qty;
      grams += l.qty;
    }
  });
  return grams ? cost/grams : 0;
}

function breakdown(code, multiplier){
  const r = getRecipe(code);
  const lines = []; let totalCost=0, totalGrams=0;
  r.lines.forEach(l=>{
    if(l.kind==='ing'){
      const ing = getIng(l.ref);
      if(!ing){ lines.push({name:'(ingrediente eliminado)', qty:0, unit:'g', price:0, cost:0, isSub:false, missing:true}); return; }
      const qty = l.qty * multiplier;
      const unitPrice = pricePerBaseUnit(ing);
      const cost = qty * unitPrice;
      const grams = qty * (UNIT_TO_GRAMS[ing.unit]||1);
      const baseUnitLabel = ing.unit==='litro' ? 'L' : ing.unit==='unidad' ? 'ud' : 'kg';
      lines.push({name:ing.name, qty, unit:ing.unit, price:unitPrice, basePrice:ing.price, baseUnitLabel, cost, isSub:false});
      totalCost += cost; totalGrams += grams;
    } else {
      const sr = getRecipe(l.ref);
      const cpg = subCostPerGram(l.ref);
      const qty = l.qty * multiplier;
      const cost = cpg * qty;
      lines.push({name: sr ? sr.name : l.ref, qty, unit:'g', price:cpg, basePrice:cpg, baseUnitLabel:'g', cost, isSub:true, subCode:l.ref});
      totalCost += cost; totalGrams += qty;
    }
  });
  const terrina = r.terrina || null;
  const terrinaCount = terrina ? Math.floor(totalGrams/terrina) : null;
  const costPerTerrina = terrina && totalGrams ? (totalCost/totalGrams)*terrina : null;
  return {lines, totalCost, totalGrams, costPerGram: totalGrams?totalCost/totalGrams:0, terrina, terrinaCount, costPerTerrina};
}

// ============== VISTA: DETALLE / IMPRESIÓN DE RECETA ==============
function renderRecetaDetalle(code){
  const r = getRecipe(code);
  const main = document.getElementById('main');
  if(!r){ state.view='recetas'; render(); return; }
  const mult = state.multiplier[code] || 1;
  const b = breakdown(code, mult);
  const chips = [1,2,4,8].map(m=>`<div class="scale-chip ${mult===m?'active':''}" data-m="${m}">x${m}</div>`).join('');

  const rows = b.lines.map(l=>`
    <tr>
      <td>${l.name}${l.isSub?`<span class="subrecipe-tag">${l.subCode}</span>`:''}${l.missing?' <span class="muted">(falta)</span>':''}</td>
      <td class="num">${l.unit==='g'?fmtQty(l.qty,'g'):fmtQty(l.qty,l.unit)}</td>
      <td class="num muted no-print">${fmtPrice(l.basePrice)}/${l.baseUnitLabel}</td>
      <td class="num">${fmt(l.cost)}</td>
    </tr>`).join('');

  let terrinaKpi = '';
  if(b.terrina){
    terrinaKpi = `<div class="kpi"><div class="v">${b.terrinaCount}</div><div class="l">Terrinas de ${b.terrina}g</div></div>
      <div class="kpi"><div class="v">${fmt(b.costPerTerrina)}</div><div class="l">Costo / terrina</div></div>`;
  }

  main.innerHTML = `
    <div class="topbar">
      <div><div class="eyebrow">${r.code} · ${r.cat}<span class="type-tag ${r.type}">${r.type==='sub'?'sub-receta':'receta final'}</span></div><h2>${r.name}</h2></div>
      <div class="actions no-print">
        <button class="btn secondary" id="btn-back">← Recetas</button>
        <button class="btn secondary" id="btn-edit">Modificar</button>
        <button class="btn" id="btn-print">Imprimir ficha</button>
      </div>
    </div>

    <div class="card no-print">
      <h3>Escalado</h3>
      <div class="scale-row"><span class="muted">Multiplicador:</span>${chips}
        <input type="number" id="mult-input" min="0.1" step="0.1" value="${mult}" style="width:70px;">
      </div>
      <div class="kpi-row">
        <div class="kpi"><div class="v">${fmtQty(b.totalGrams,'g')}</div><div class="l">Rendimiento</div></div>
        <div class="kpi"><div class="v">${fmt(b.totalCost)}</div><div class="l">Costo total</div></div>
        <div class="kpi"><div class="v">${fmt(b.costPerGram)}</div><div class="l">Costo / gramo</div></div>
        ${terrinaKpi}
      </div>
    </div>

    <div class="card">
      <h3>Ingredientes${mult!==1?` (x${mult})`:''}</h3>
      <table><thead><tr><th>Ingrediente</th><th class="num">Cantidad</th><th class="num no-print">Precio</th><th class="num">Costo</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>

    <div class="card">
      <h3>Procedimiento</h3>
      <ol class="steps-list">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>
    ${r.notes?`<div class="card"><h3>Notas</h3><p class="muted" style="font-size:13.5px;">${r.notes}</p></div>`:''}
  `;

  document.getElementById('btn-back').onclick = ()=>{ state.view='recetas'; render(); };
  document.getElementById('btn-edit').onclick = ()=>{ state.draft = cloneForEdit(r); state.view='receta-edit'; render(); };
  document.getElementById('btn-print').onclick = ()=> window.print();
  main.querySelectorAll('.scale-chip').forEach(el=>{
    el.onclick = ()=>{ state.multiplier[code] = parseFloat(el.dataset.m); render(); };
  });
  document.getElementById('mult-input').onchange = (e)=>{ state.multiplier[code] = parseFloat(e.target.value)||1; render(); };
}

// ============== VISTA: CREAR / MODIFICAR RECETA ==============
function blankRecipe(){
  return {code:'', name:'', cat:'', type:'final', terrina:'', notes:'', lines:[], steps:[''], _isNew:true, _originalCode:null};
}
function cloneForEdit(r){
  return {...JSON.parse(JSON.stringify(r)), _isNew:false, _originalCode:r.code};
}

function renderRecetaEdit(){
  const d = state.draft;
  const main = document.getElementById('main');

  const subOptions = DATA.recipes.filter(r=> r.code !== d._originalCode).map(r=>`<option value="${r.code}">${r.code} — ${r.name}</option>`).join('');
  const ingOptions = DATA.ingredients.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(i=>`<option value="${i.id}">${i.name}</option>`).join('');

  const lineRows = d.lines.map((l,idx)=>{
    if(l.kind==='ing'){
      const ing = getIng(l.ref);
      return `<div class="line-row" data-idx="${idx}">
        <select data-lf="kind"><option value="ing" selected>Ingrediente</option><option value="sub">Sub-receta</option></select>
        <select data-lf="ref">${ingOptions.replace(`value="${l.ref}"`, `value="${l.ref}" selected`)}</select>
        <input type="number" step="0.1" data-lf="qty" value="${l.qty}">
        <span class="muted">${ing?UNIT_LABEL[ing.unit]:'—'}</span>
        <button class="btn danger small" data-rmline="${idx}">✕</button>
      </div>`;
    } else {
      return `<div class="line-row" data-idx="${idx}">
        <select data-lf="kind"><option value="ing">Ingrediente</option><option value="sub" selected>Sub-receta</option></select>
        <select data-lf="ref">${subOptions.replace(`value="${l.ref}"`, `value="${l.ref}" selected`)}</select>
        <input type="number" step="0.1" data-lf="qty" value="${l.qty}">
        <span class="muted">g (equiv.)</span>
        <button class="btn danger small" data-rmline="${idx}">✕</button>
      </div>`;
    }
  }).join('') || '<p class="muted">Sin ingredientes todavía.</p>';

  const stepRows = d.steps.map((s,idx)=>`
    <div class="step-row" data-idx="${idx}">
      <div class="step-num">${idx+1}</div>
      <textarea data-step="${idx}" placeholder="Describe este paso...">${escapeHtml(s)}</textarea>
      <button class="btn danger small" data-rmstep="${idx}">✕</button>
    </div>`).join('');

  main.innerHTML = `
    <div class="topbar">
      <div><div class="eyebrow">${d._isNew?'Nueva receta':'Modificando '+d._originalCode}</div><h2>${d._isNew?'Crear receta':d.name||'(sin nombre)'}</h2></div>
      <div class="actions no-print">
        <button class="btn secondary" id="btn-cancel">Cancelar</button>
        ${!d._isNew?'<button class="btn danger" id="btn-delete">Eliminar receta</button>':''}
        <button class="btn" id="btn-save">Guardar</button>
      </div>
    </div>

    <div class="card">
      <h3>Datos generales</h3>
      <div class="form-row">
        <div class="field"><label>Código</label><input id="f-code" value="${escapeAttr(d.code)}" placeholder="FT-12"></div>
        <div class="field" style="flex:2;"><label>Nombre</label><input id="f-name" value="${escapeAttr(d.name)}" placeholder="Nombre de la receta"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Categoría</label><input id="f-cat" value="${escapeAttr(d.cat)}" placeholder="Ej: Salsa"></div>
        <div class="field"><label>Tipo</label>
          <select id="f-type"><option value="final" ${d.type==='final'?'selected':''}>Receta final</option><option value="sub" ${d.type==='sub'?'selected':''}>Sub-receta</option></select>
        </div>
        <div class="field"><label>Terrina (g, opcional)</label><input id="f-terrina" type="number" value="${d.terrina||''}" placeholder="Ej: 60"></div>
      </div>
    </div>

    <div class="card">
      <h3>Ingredientes</h3>
      <div id="lines-container">${lineRows}</div>
      <button class="btn secondary small" id="btn-add-line" style="margin-top:8px;">+ Agregar línea</button>
    </div>

    <div class="card">
      <h3>Procedimiento</h3>
      <div id="steps-container">${stepRows}</div>
      <button class="btn secondary small" id="btn-add-step" style="margin-top:4px;">+ Agregar paso</button>
    </div>

    <div class="card">
      <h3>Notas (opcional)</h3>
      <textarea id="f-notes" style="width:100%;min-height:60px;" placeholder="Notas, validaciones, aclaraciones...">${escapeHtml(d.notes||'')}</textarea>
    </div>
  `;

  // eventos generales
  document.getElementById('f-code').oninput = e=> d.code = e.target.value.trim();
  document.getElementById('f-name').oninput = e=> d.name = e.target.value;
  document.getElementById('f-cat').oninput = e=> d.cat = e.target.value;
  document.getElementById('f-type').onchange = e=> d.type = e.target.value;
  document.getElementById('f-terrina').oninput = e=> d.terrina = e.target.value ? parseFloat(e.target.value) : null;
  document.getElementById('f-notes').oninput = e=> d.notes = e.target.value;

  // líneas de ingredientes
  main.querySelectorAll('#lines-container .line-row').forEach(row=>{
    const idx = parseInt(row.dataset.idx);
    row.querySelector('[data-lf="kind"]').onchange = (e)=>{
      d.lines[idx].kind = e.target.value;
      d.lines[idx].ref = e.target.value==='ing' ? (DATA.ingredients[0]?.id||'') : (DATA.recipes[0]?.code||'');
      renderRecetaEdit();
    };
    row.querySelector('[data-lf="ref"]').onchange = (e)=>{ d.lines[idx].ref = e.target.value; renderRecetaEdit(); };
    row.querySelector('[data-lf="qty"]').oninput = (e)=>{ d.lines[idx].qty = parseFloat(e.target.value)||0; };
    row.querySelector('[data-rmline]').onclick = ()=>{ d.lines.splice(idx,1); renderRecetaEdit(); };
  });
  document.getElementById('btn-add-line').onclick = ()=>{
    d.lines.push({kind:'ing', ref: DATA.ingredients[0]?.id||'', qty:0});
    renderRecetaEdit();
  };

  // pasos
  main.querySelectorAll('#steps-container textarea').forEach(ta=>{
    ta.oninput = (e)=>{ d.steps[parseInt(e.target.dataset.step)] = e.target.value; };
  });
  main.querySelectorAll('[data-rmstep]').forEach(btn=>{
    btn.onclick = ()=>{ d.steps.splice(parseInt(btn.dataset.rmstep),1); renderRecetaEdit(); };
  });
  document.getElementById('btn-add-step').onclick = ()=>{ d.steps.push(''); renderRecetaEdit(); };

  document.getElementById('btn-cancel').onclick = ()=>{
    state.draft=null;
    state.view = d._isNew ? 'recetas' : 'receta:'+d._originalCode;
    render();
  };
  if(!d._isNew){
    document.getElementById('btn-delete').onclick = ()=>{
      if(!confirm(`¿Eliminar ${d._originalCode} — ${d.name}? Si otras recetas la usan como sub-receta, esas líneas quedarán rotas.`)) return;
      DATA.recipes = DATA.recipes.filter(r=>r.code!==d._originalCode);
      saveData(true); state.draft=null; state.view='recetas'; render();
    };
  }
  document.getElementById('btn-save').onclick = ()=>{
    if(!d.code.trim()){ toast('Ponle un código a la receta (ej: FT-12)', 'error'); return; }
    if(!d.name.trim()){ toast('Ponle un nombre a la receta', 'error'); return; }
    const clash = DATA.recipes.find(r=> r.code===d.code && r.code!==d._originalCode);
    if(clash){ toast('Ya existe una receta con ese código', 'error'); return; }
    const steps = d.steps.map(s=>s.trim()).filter(Boolean);
    const clean = {code:d.code.trim(), name:d.name.trim(), cat:d.cat.trim(), type:d.type, terrina:d.terrina||null, notes:(d.notes||'').trim(), lines:d.lines, steps};
    if(d._isNew){
      DATA.recipes.push(clean);
    } else {
      const i = DATA.recipes.findIndex(r=>r.code===d._originalCode);
      DATA.recipes[i] = clean;
    }
    saveData(true);
    state.draft=null; state.view='receta:'+clean.code; render();
  };
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function blankSupplier(){

}

}

function renderProveedorEdit(){
  const d = state.draft;
  const main = document.getElementById('main');

  const chips = DATA.ingredients.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(ing=>{
    const active = (d.ingredientIds||[]).includes(ing.id);
    return `<div class="scale-chip ${active?'active':''}" data-ingchip="${ing.id}" style="margin:3px 5px 3px 0;display:inline-block;">${escapeHtml(ing.name)}</div>`;

      <div class="actions no-print">
        <button class="btn secondary" id="btn-cancel">Cancelar</button>
        ${!d._isNew?'<button class="btn danger" id="btn-delete">Eliminar proveedor</button>':''}

      <h3>Datos generales</h3>

      </div>

  document.getElementById('f-email').oninput = e=> d.email = e.target.value;
  document.getElementById('f-notes').oninput = e=> d.notes = e.target.value;

  main.querySelectorAll('[data-ingchip]').forEach(chip=>{
    chip.onclick = ()=>{
      const id = chip.dataset.ingchip;
      d.ingredientIds = d.ingredientIds || [];
      const i = d.ingredientIds.indexOf(id);
      if(i>=0) d.ingredientIds.splice(i,1); else d.ingredientIds.push(id);
      chip.classList.toggle('active');
    };
  });

  document.getElementById('btn-cancel').onclick = ()=>{ state.draft=null; state.view='proveedores'; render(); };
  if(!d._isNew){
    document.getElementById('btn-delete').onclick = ()=>{
      if(!confirm(`¿Eliminar el proveedor "${d.name}"?`)) return;
      DATA.suppliers = DATA.suppliers.filter(s=>s.id!==d._originalId);
      saveData(true); state.draft=null; state.view='proveedores'; render();
    };
  }
  document.getElementById('btn-save').onclick = ()=>{
    if(!d.name.trim()){ toast('Ponle un nombre al proveedor', 'error'); return; }

      id: d._isNew ? uid('sup') : d._originalId,
      name:d.name.trim(), category:d.category.trim(), phone:d.phone.trim(), email:d.email.trim(),
      notes:(d.notes||'').trim(), ingredientIds: d.ingredientIds||[]
    };
    if(d._isNew) DATA.suppliers.push(clean);
    else { const i = DATA.suppliers.findIndex(s=>s.id===d._originalId); DATA.suppliers[i] = clean; }
    saveData(true);
    state.draft=null; state.view='proveedores'; render();
  };
}

function ingCode(id){
  const idx = DATA.ingredients.findIndex(i=>i.id===id);
  return idx>=0 ? 1001+idx : '—';
}
function subCode(code){
  const subs = DATA.recipes.filter(r=>r.type==='sub');
  const idx = subs.findIndex(r=>r.code===code);
  return idx>=0 ? 2001+idx : '—';
}
function round2(n){ return Math.round((n||0)*100)/100; }
function round4(n){ return Math.round((n||0)*10000)/10000; }

}
function buildEscandalloGeneralAOA(){
  const rows = [['Código','Receta','Tipo','Rendimiento (g)','Costo total','Costo / g','Terrina (g)','N.º terrinas','Costo / terrina']];
  DATA.recipes.forEach(r=>{
    const b = breakdown(r.code, 1);
    rows.push([r.code, r.name, r.type==='sub'?'Sub-receta':'Receta final', round2(b.totalGrams), round2(b.totalCost), round4(b.costPerGram),
      b.terrina||'', b.terrina?b.terrinaCount:'', b.terrina?round2(b.costPerTerrina):'']);
  });
  return rows;
}
function buildRecipeAOA(code){
  const r = getRecipe(code);
  const b = breakdown(code, 1);
  const rows = [
    [`${r.code} — ${r.name}`],
    [r.cat + (r.type==='sub' ? ' · SUB-RECETA' : '')],
    [],
    ['Cod','Ingrediente','UND','Cantidad','Costo u.','Costo'],
  ];
  b.lines.forEach((l, idx)=>{
    const line = r.lines[idx];
    const cod = line.kind==='ing' ? ingCode(line.ref) : subCode(line.ref);
    const und = line.kind==='ing' ? UNIT_LABEL[getIng(line.ref)?.unit || 'g'] : 'g';
    rows.push([cod, l.name, und, round2(l.qty), round4(l.price), round2(l.cost)]);
  });
  rows.push([]);
  rows.push(['','Costo total','','','', round2(b.totalCost)]);
  rows.push(['','Rendimiento (g)','','','', round2(b.totalGrams)]);
  rows.push(['','Costo por gramo','','','', round4(b.costPerGram)]);
  if(b.terrina){
    rows.push(['','Terrina (g)','','','', b.terrina]);
    rows.push(['','Cantidad de terrinas','','','', b.terrinaCount]);
    rows.push(['','Costo por terrina','','','', round2(b.costPerTerrina)]);
  }
  return rows;
}
function exportEscandalloXlsx(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el generador de Excel (revisa tu conexión)', 'error'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildEscandalloGeneralAOA()), 'Escandallo General');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildIngredientesAOA()), 'INGREDIENTES');
  DATA.recipes.forEach(r=>{
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildRecipeAOA(r.code)), r.code);
  });
  XLSX.writeFile(wb, 'Escandallo_General_Tio_Pollo.xlsx');
  toast('Excel descargado', 'success');
}

// ============== VISTA: LIBRO DE RECETAS (compilado, imprimible) ==============
function renderLibro(){
  const main = document.getElementById('main');
  const cover = `
    <div class="book-cover">
      <img src="${LOGO_SRC}" alt="Tío Pollo">
      <h1>Libro de Recetas</h1>
      <p>Recetario estandarizado — Tío Pollo · ${DATA.recipes.length} fichas técnicas</p>
    </div>
  `;
  const indexRows = DATA.recipes.map(r=>`
    <tr><td>${r.code}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.cat)}</td><td>${r.type==='sub'?'Sub-receta':'Receta final'}</td></tr>
  `).join('');
  const indexBlock = `
    <div class="card">
      <h3>Índice</h3>
      <table class="book-index-table">
        <thead><tr><th>Código</th><th>Receta</th><th>Categoría</th><th>Tipo</th></tr></thead>
        <tbody>${indexRows}</tbody>
      </table>
    </div>
  `;
  const recipeBlocks = DATA.recipes.map((r, idx)=>{
    const b = breakdown(r.code, 1);
    const rows = r.lines.map(l=>{
      if(l.kind==='ing'){
        const ing = getIng(l.ref);
        if(!ing) return `<tr><td colspan="3" class="muted">(ingrediente eliminado)</td></tr>`;
        return `<tr><td>${escapeHtml(ing.name)}</td><td class="num">${fmtQty(l.qty, ing.unit)}</td></tr>`;
      } else {
        const sr = getRecipe(l.ref);
        return `<tr><td>${escapeHtml(sr?sr.name:l.ref)} <span class="subrecipe-tag">${l.ref}</span></td><td class="num">${fmtQty(l.qty,'g')}</td></tr>`;
      }
    }).join('');
    return `
      <div class="book-recipe book-page-break">
        <div class="book-banner">
          <div class="eyebrow2">${r.code} · ${r.cat}${r.type==='sub'?' · SUB-RECETA':''}</div>
          <h3>${escapeHtml(r.name)}</h3>
        </div>
        <div class="card">
          <h3>Ingredientes</h3>
          <table><thead><tr><th>Ingrediente</th><th class="num">Cantidad</th></tr></thead><tbody>${rows}</tbody></table>
        </div>
        <div class="card">
          <h3>Procedimiento</h3>
          <ol class="steps-list">${r.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>
        </div>
        ${r.terrina?`<p class="muted">Envasado: terrinas de ${r.terrina} g · rinde ${b.terrinaCount} terrinas (base x1).</p>`:''}
        ${r.notes?`<p class="muted"><em>Nota: ${escapeHtml(r.notes)}</em></p>`:''}
      </div>
    `;
  }).join('');

  main.innerHTML = `
    <div class="topbar no-print">
      <div><div class="eyebrow">Tío Pollo</div><h2>Libro de recetas</h2></div>
      <div class="actions">
        <button class="btn secondary" id="btn-back">← Recetas</button>
        <button class="btn" id="btn-print-libro">Imprimir / Guardar PDF</button>
      </div>
    </div>
    <div class="book-page-break" style="border:none;margin:0;padding:0;">${cover}</div>
    <div class="book-page-break">${indexBlock}</div>
    ${recipeBlocks}
  `;
  document.getElementById('btn-back').onclick = ()=>{ state.view='recetas'; render(); };
  document.getElementById('btn-print-libro').onclick = ()=> window.print();
}

// ============== VISTA: ESCANDALLO GENERAL (consolidado, imprimible) ==============
function renderEscandallo(){
  const main = document.getElementById('main');
  const rows = DATA.recipes.map(r=>{
    const b = breakdown(r.code, 1);
    return `<tr class="esc-row" data-code="${r.code}" style="cursor:pointer;">
      <td>${r.code}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${r.type==='sub'?'Sub-receta':'Receta final'}</td>
      <td class="num">${fmtQty(b.totalGrams,'g')}</td>
      <td class="num">${fmt(b.totalCost)}</td>
      <td class="num">${fmt(b.costPerGram)}</td>
      <td class="num">${b.terrina ? b.terrina+' g' : '—'}</td>
      <td class="num">${b.terrina ? b.terrinaCount : '—'}</td>
      <td class="num">${b.terrina ? fmt(b.costPerTerrina) : '—'}</td>
      <td class="num no-print"><button class="btn secondary small" data-detalle="${r.code}">Detalle</button></td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="topbar no-print">
      <div><div class="eyebrow">Tío Pollo</div><h2>Escandallo general</h2></div>
      <div class="actions">
        <button class="btn secondary" id="btn-back">← Recetas</button>
        <button class="btn secondary" id="btn-export-xlsx">Exportar a Excel</button>
        <button class="btn" id="btn-print-esc">Imprimir / Guardar PDF</button>
      </div>
    </div>
    <div class="card">
      <h3>Costeo consolidado — ${DATA.recipes.length} recetas</h3>
      <p class="muted" style="margin-top:-6px;">Se calcula en vivo con los precios actuales de "Ingredientes". Las sub-recetas ya vienen encadenadas. Toca una fila para ver el detalle línea por línea.</p>
      <table>
        <thead><tr>
          <th>Código</th><th>Receta</th><th>Tipo</th><th class="num">Rendimiento</th><th class="num">Costo total</th>
          <th class="num">Costo / g</th><th class="num">Terrina</th><th class="num">N.º terrinas</th><th class="num">Costo / terrina</th><th class="no-print"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  document.getElementById('btn-back').onclick = ()=>{ state.view='recetas'; render(); };
  document.getElementById('btn-print-esc').onclick = ()=> window.print();
  document.getElementById('btn-export-xlsx').onclick = exportEscandalloXlsx;
  main.querySelectorAll('.esc-row').forEach(tr=>{
    tr.onclick = (e)=>{ if(e.target.closest('button')) return; state.view = 'escandallo-receta:'+tr.dataset.code; render(); };
  });
  main.querySelectorAll('[data-detalle]').forEach(btn=>{
    btn.onclick = ()=>{ state.view = 'escandallo-receta:'+btn.dataset.detalle; render(); };
  });
}

// ============== VISTA: ESCANDALLO DETALLADO POR RECETA ==============
function renderEscandalloReceta(code){
  const r = getRecipe(code);
  const main = document.getElementById('main');
  if(!r){ state.view='escandallo'; render(); return; }
  const b = breakdown(code, 1);

  const rows = b.lines.map((l, idx)=>{
    const line = r.lines[idx];
    const cod = line.kind==='ing' ? ingCode(line.ref) : subCode(line.ref);
    const und = line.kind==='ing' ? UNIT_LABEL[getIng(line.ref)?.unit||'g'] : 'g';
    return `<tr>
      <td>${cod}</td>
      <td>${l.name}${l.isSub?`<span class="subrecipe-tag">${l.subCode}</span>`:''}</td>
      <td>${und}</td>
      <td class="num">${l.qty.toLocaleString('es-ES',{maximumFractionDigits:1})}</td>
      <td class="num">${fmtPrice(l.basePrice)}/${l.baseUnitLabel}</td>
      <td class="num">${fmt(l.cost)}</td>
    </tr>`;
  }).join('');

  let terrinaKpi = '';
  if(b.terrina){
    terrinaKpi = `<div class="kpi"><div class="v">${b.terrinaCount}</div><div class="l">Terrinas de ${b.terrina}g</div></div>
      <div class="kpi"><div class="v">${fmt(b.costPerTerrina)}</div><div class="l">Costo / terrina</div></div>`;
  }

  main.innerHTML = `
    <div class="topbar">
      <div><div class="eyebrow no-print">${r.code} · ${r.cat}${r.type==='sub'?' · Sub-receta':''}</div><h2>Escandallo — ${r.name}</h2></div>
      <div class="actions no-print">
        <button class="btn secondary" id="btn-back">← Escandallo general</button>
        <button class="btn" id="btn-print">Imprimir ficha de costeo</button>
      </div>
    </div>
    <div class="card no-print">
      <div class="kpi-row">
        <div class="kpi"><div class="v">${fmtQty(b.totalGrams,'g')}</div><div class="l">Rendimiento</div></div>
        <div class="kpi"><div class="v">${fmt(b.totalCost)}</div><div class="l">Costo total</div></div>
        <div class="kpi"><div class="v">${fmt(b.costPerGram)}</div><div class="l">Costo / gramo</div></div>
        ${terrinaKpi}
      </div>
    </div>
    <div class="card">
      <h3>Detalle de costeo</h3>
      <table>
        <thead><tr><th>Cod</th><th>Ingrediente</th><th>UND</th><th class="num">Cantidad</th><th class="num">Costo u.</th><th class="num">Costo</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  document.getElementById('btn-back').onclick = ()=>{ state.view='escandallo'; render(); };
  document.getElementById('btn-print').onclick = ()=> window.print();
}

// ============== RENDER PRINCIPAL ==============
function skeletonLoader(){
  return `<div class="skel-wrap">
    <div class="skel-line"></div>
    <div class="skel-grid">${Array(6).fill('<div class="skel-card"></div>').join('')}</div>
  </div>`;
}
function render(){
  const mainEl = document.getElementById('main');
  if(!state.loaded){
    mainEl.innerHTML = skeletonLoader();
    return;
  }
  renderSidebar();
  if(state.view==='ingredientes') renderIngredientes();
  else if(state.view==='proveedores') renderProveedores();
  else if(state.view==='proveedor-edit') renderProveedorEdit();
  else if(state.view==='recetas') renderRecetas();
  else if(state.view==='receta-edit') renderRecetaEdit();
  else if(state.view==='libro') renderLibro();
  else if(state.view==='escandallo') renderEscandallo();
  else if(state.view.startsWith('escandallo-receta:')) renderEscandalloReceta(state.view.split(':')[1]);
  else if(state.view.startsWith('receta:')) renderRecetaDetalle(state.view.split(':')[1]);
  else renderRecetas();
  mainEl.classList.remove('view-fade');
  void mainEl.offsetWidth;
  mainEl.classList.add('view-fade');
}

loadData();
